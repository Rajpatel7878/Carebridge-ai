name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: carebridge_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d carebridge_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install --force-reinstall --no-deps opencv-python-headless==5.1.0.95
      - run: pytest -q
        env:
          CAREBRIDGE_TEST_POSTGRES_URL: postgresql+psycopg://ci_user:ci_test_only@localhost:5432/carebridge_ci_test
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
