# =============================================================================
# CareBridge AI — Docker Compose Stack (Optional for Local Development)
# Copy .env.example to .env and set POSTGRES_PASSWORD and SECRET_KEY first:
#   cp .env.example .env
#   docker compose up --build
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: carebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carebridge_ai}
      POSTGRES_USER: ${POSTGRES_USER:-carebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before running docker compose}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carebridge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carebridge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-CareBridge AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carebridge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before running docker compose}@postgres:5432/${POSTGRES_DB:-carebridge_ai}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (>=32 chars) in .env before running docker compose}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-carebridge-ai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-carebridge-ai-web}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SESSION_REFRESH_EXPIRE_HOURS: ${SESSION_REFRESH_EXPIRE_HOURS:-12}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-15}
      REGISTER_RATE_LIMIT_IP_ATTEMPTS: ${REGISTER_RATE_LIMIT_IP_ATTEMPTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      UPLOAD_STORAGE_DIR: /app/uploads/medical_reports
      MAX_REPORT_UPLOAD_MB: ${MAX_REPORT_UPLOAD_MB:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    volumes:
      - report_uploads:/app/uploads/medical_reports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - carebridge-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: carebridge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - carebridge-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: carebridge_postgres_data
  report_uploads:
    name: carebridge_report_uploads

networks:
  carebridge-network:
    name: carebridge_network
    driver: bridge
